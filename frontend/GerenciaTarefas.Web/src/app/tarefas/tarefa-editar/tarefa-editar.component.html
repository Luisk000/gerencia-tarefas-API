<form [formGroup]="tarefaForm" (ngSubmit)="confirmarEdicao()">
  <div class="tarefa-header">
    <input class="titulo form-control form-control-sm" type="text" formControlName="titulo" />
    <div class="buttons">
      <button class="btn btn-sm btn-danger" type="button" (click)="cancelarEdicao()">
        Cancelar
      </button>
      <button class="btn btn-sm btn-success" type="submit">Confirmar</button>
    </div>
  </div>
  <textarea class="descricao form-control form-control-sm" formControlName="descricao">
</textarea
  >
  <div class="dados-tarefa">
    <div>
      <span class="dado-tarefa">STATUS</span>
      <select class="form-control form-control-sm" formControlName="status">
        <option *ngFor="let status of tarefa.todos_status" [value]="status">{{ status }}</option>
      </select>
    </div>
    <div>
      <span class="dado-tarefa">PRIORIDADE</span>
      <select class="form-control form-control-sm" formControlName="prioridade">
        <option *ngFor="let prioridade of tarefa.todas_prioridades" [value]="prioridade">{{ prioridade }}</option>
      </select>
    </div>
    <div>
      <span class="dado-tarefa">DATA DE CRIAÇÃO</span>
      {{ tarefa.data_criacao | date: 'dd/MM/yyyy' }}
    </div>
  </div>
</form>
