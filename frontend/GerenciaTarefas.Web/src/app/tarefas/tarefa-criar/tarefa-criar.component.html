<div *ngIf="!adicionando">
  <div class="tarefa-header">
    <b class="titulo" (click)="startAdicionando()">
      Adicionar nova tarefa
    </b>
  </div>
</div>
<form [formGroup]="tarefaForm" (ngSubmit)="confirmarAdicao()" *ngIf="adicionando">
  <div class="tarefa-header">
    <input class="titulo form-control form-control-sm" type="text" formControlName="titulo" placeholder="Titulo">
    <div class="buttons">
      <button class="btn btn-sm btn-danger" type="button" (click)="cancelarAdicao()">Cancelar</button>
      <button class="btn btn-sm btn-success" type="submit" [disabled]="!tarefaForm.valid">Confirmar</button>
    </div>
  </div>
  <div>
    <textarea class="descricao form-control form-control-sm" formControlName="descricao" placeholder="Descrição">
    </textarea>
    <div class="dados-tarefa">
      <div>
        <span class="dado-tarefa">PRIORIDADE</span>
        <select class="form-control form-control-sm" formControlName="prioridade">
          <option selected></option>
          <option *ngFor="let prioridade of prioridades">{{ prioridade }}</option>
        </select>
      </div>
    </div>
  </div>
</form>
